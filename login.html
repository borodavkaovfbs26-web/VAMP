
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Вхід — VAMP</title>

 <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <a href="index.html" class="auth-logo">
      VAMP<span>.</span>
    </a>

    <div class="auth-card">

      <div class="auth-heading">
        <span class="section-label">ЛАСКАВО ПРОСИМО</span>
        <h1 id="authTitle">З поверненням!</h1>
        <p id="authSubtitle">
          Увійди до свого особистого кабінету.
        </p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="loginTab" class="auth-tab active">
          Увійти
        </button>

        <button type="button" id="registerTab" class="auth-tab">
          Реєстрація
        </button>
      </div>

      <form id="authForm">

        <div id="nameField" class="form-group hidden">
          <label for="fullName">Твоє ім'я</label>
          <input
            type="text"
            id="fullName"
            placeholder="Введи своє ім'я"
          >
        </div>

        <div class="form-group">
          <label for="email">Електронна пошта</label>
          <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            placeholder="Введи пароль"
            minlength="6"
            required
          >
        </div>

        <button type="submit" id="authButton" class="primary-button auth-submit">
          Увійти →
        </button>

        <p id="authMessage" class="auth-message"></p>

      </form>

      <div class="auth-footer">
        <a href="index.html">← Повернутися на головну</a>
      </div>

    </div>

    <p class="auth-copyright">
      © 2026 VAMP. Усі права захищені.
    </p>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>

    const authClient = window.vampSupabase;

    const authForm = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");

    const authButton = document.getElementById("authButton");
    const authMessage = document.getElementById("authMessage");

    const nameField = document.getElementById("nameField");
    const fullName = document.getElementById("fullName");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    let isRegistering = false;


    // Перемикання на вхід
    loginTab.addEventListener("click", () => {

      isRegistering = false;

      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      nameField.classList.add("hidden");

      authTitle.textContent = "З поверненням!";
      authSubtitle.textContent =
        "Увійди до свого особистого кабінету.";

      authButton.textContent = "Увійти →";

      authMessage.textContent = "";

    });


    // Перемикання на реєстрацію
    registerTab.addEventListener("click", () => {

      isRegistering = true;

      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      nameField.classList.remove("hidden");

      authTitle.textContent = "Створи акаунт";
      authSubtitle.textContent =
        "Приєднуйся до освітнього простору VAMP.";

      authButton.textContent = "Зареєструватися →";

      authMessage.textContent = "";

    });


    // Вхід або реєстрація
    authForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      authButton.disabled = true;
      authButton.textContent = "Зачекай...";
      authMessage.textContent = "";

      try {

        if (isRegistering) {

          const name = fullName.value.trim();

          if (!name) {
            throw new Error("Введи своє ім'я.");
          }

          const { data, error } = await authClient.auth.signUp({

            email: email,
            password: password,

            options: {
              data: {
                full_name: name
              }
            }

          });

          if (error) throw error;

          if (data.user && data.session) {

            const { error: profileError } =
              await authClient
                .from("profiles")
                .upsert({

                  id: data.user.id,
                  full_name: name,
                  role: "student"

                });

            if (profileError) throw profileError;

            authMessage.textContent =
              "Реєстрація успішна! Перенаправляємо...";

            window.location.href = "dashboard.html";

          } else {

            authMessage.textContent =
              "Акаунт створено! Перевір електронну пошту для підтвердження.";

          }

        } else {

          const { data, error } =
            await authClient.auth.signInWithPassword({

              email: email,
              password: password

            });

          if (error) throw error;

          if (data.user) {

            authMessage.textContent =
              "Вхід успішний! Перенаправляємо...";

            window.location.href = "dashboard.html";

          }

        }

      } catch (error) {

        authMessage.textContent =
          "Помилка: " + error.message;

      }

      authButton.disabled = false;

      authButton.textContent =
        isRegistering
          ? "Зареєструватися →"
          : "Увійти →";

    });

  </script>

</body>
</html>
