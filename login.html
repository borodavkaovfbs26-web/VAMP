
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — VAMP</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

<div class="auth-page">
  <div class="auth-card">

    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <span class="brand-name">VAMP</span>
    </a>

    <div class="eyebrow">ТВОЯ ОСВІТНЯ ІСТОРІЯ</div>

    <h1 id="authTitle">З поверненням!</h1>

    <p class="subtitle">
      Увійди до свого навчального простору.
    </p>

    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">
        Вхід
      </button>

      <button id="signupTab" type="button">
        Реєстрація
      </button>
    </div>

    <div id="notice" hidden></div>

    <form id="authForm" class="form-grid">

      <div class="field" id="nameField" hidden>
        <label>Ім'я та прізвище</label>

        <input
          class="input"
          name="full_name"
          placeholder="Як тебе звати?"
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label>Email</label>

        <input
          class="input"
          name="email"
          type="email"
          required
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>Пароль</label>

        <input
          class="input"
          name="password"
          type="password"
          required
          minlength="6"
          placeholder="Мінімум 6 символів"
          autocomplete="current-password"
        >
      </div>

      <button class="btn btn-primary" id="submitBtn" type="submit">
        Увійти →
      </button>

    </form>

    <button
      id="forgotBtn"
      class="btn"
      type="button"
      style="width:100%;margin-top:12px"
    >
      Забули пароль?
    </button>

    <p class="footer-note">
      Захищений вхід · VAMP
    </p>

  </div>
</div>

<script>
const sb = window.vampSupabase;

let mode = new URLSearchParams(location.search)
  .get("mode") === "signup"
  ? "signup"
  : "login";

const $ = selector => document.querySelector(selector);

// Правильний шлях для GitHub Pages
function getPageUrl(page) {
  return new URL(page, window.location.href).href;
}

// Повідомлення
function notice(message, type = "") {
  const box = $("#notice");

  box.hidden = false;
  box.className = "notice " + type;
  box.textContent = message;
}

// Перемикання входу та реєстрації
function setMode(nextMode) {
  mode = nextMode;

  $("#loginTab").classList.toggle(
    "active",
    mode === "login"
  );

  $("#signupTab").classList.toggle(
    "active",
    mode === "signup"
  );

  $("#nameField").hidden = mode !== "signup";

  $("#authTitle").textContent =
    mode === "signup"
      ? "Створи акаунт"
      : "З поверненням!";

  $("#submitBtn").textContent =
    mode === "signup"
      ? "Зареєструватися →"
      : "Увійти →";

  $("#forgotBtn").hidden = mode === "signup";

  $("#notice").hidden = true;
}

$("#loginTab").onclick = () => setMode("login");

$("#signupTab").onclick = () => setMode("signup");

// Реєстрація та вхід
$("#authForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!sb) {
    notice("Помилка підключення. Онови сторінку.", "error");
    return;
  }

  const form = new FormData(event.currentTarget);

  const email = form.get("email").trim();
  const password = form.get("password");

  $("#submitBtn").disabled = true;

  try {

    if (mode === "signup") {

      const full_name = form.get("full_name").trim();

      if (!full_name) {
        notice("Будь ласка, введи своє ім'я.", "error");
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email: email,
        password: password,

        options: {
          data: {
            full_name: full_name
          },

          // Повернення на сторінку входу після підтвердження
          emailRedirectTo: getPageUrl("login.html")
        }
      });

      if (error) throw error;

      if (data.session) {

        notice(
          "Акаунт створено! Перенаправляємо...",
          "success"
        );

        window.location.href = getPageUrl("dashboard.html");

      } else {

        notice(
          "Реєстрація майже завершена! Перевір свою пошту та натисни на посилання для підтвердження. Після цього повернися сюди та увійди.",
          "success"
        );

        setMode("login");

      }

    } else {

      const { data, error } =
        await sb.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) throw error;

      if (data.session) {
        window.location.href = getPageUrl("dashboard.html");
      }

    }

  } catch (error) {

    console.error("Помилка авторизації:", error);

    notice(
      error.message || "Не вдалося виконати дію.",
      "error"
    );

  } finally {

    $("#submitBtn").disabled = false;

  }

});

// Відновлення пароля
$("#forgotBtn").onclick = async () => {

  if (!sb) {
    notice("Помилка підключення. Онови сторінку.", "error");
    return;
  }

  const email = $("#authForm")
    .elements.email.value.trim();

  if (!email) {

    notice("Спочатку введи свою електронну пошту.", "error");

    return;

  }

  try {

    const { error } =
      await sb.auth.resetPasswordForEmail(email, {
        redirectTo: getPageUrl("login.html")
      });

    if (error) throw error;

    notice(
      "Якщо акаунт існує, лист для відновлення пароля надіслано. Перевір свою пошту.",
      "success"
    );

  } catch (error) {

    notice(error.message || "Не вдалося надіслати лист.", "error");

  }

};

// Перевірка, чи користувач уже увійшов
async function checkSession() {

  if (!sb) {
    console.error("Supabase не підключено.");
    return;
  }

  const { data, error } = await sb.auth.getSession();

  if (error) {
    console.error("Помилка перевірки сесії:", error);
    return;
  }

  if (data.session) {

    window.location.href = getPageUrl("dashboard.html");

  }

}

setMode(mode);
checkSession();
</script>

</body>
</html>
